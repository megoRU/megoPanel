name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Sync Frontend Assets to Backend
        run: |
          mkdir -p backend/templates/frontend
          rsync -a --delete frontend/dist/ backend/templates/frontend/

      - name: Resolve Backend Dependencies
        working-directory: backend
        run: go mod tidy

      - name: Build Backend
        working-directory: backend
        run: go build -trimpath -ldflags='-s -w' -o megopanel ./cmd/server

      - name: Package Release
        run: |
          # Create a directory for packaging
          mkdir -p megopanel-release/backend
          mkdir -p megopanel-release/frontend
          mkdir -p megopanel-release/scripts
          mkdir -p megopanel-release/systemd

          # Copy everything necessary
          cp backend/megopanel megopanel-release/backend/megopanel
          cp -r backend/templates megopanel-release/backend/
          cp -r backend/configs megopanel-release/backend/
          cp -r scripts/ megopanel-release/
          cp -r systemd/ megopanel-release/
          cp README.md LICENSE megopanel-release/

          # Package it up
          tar -czf megopanel.tar.gz -C megopanel-release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: megopanel.tar.gz
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
